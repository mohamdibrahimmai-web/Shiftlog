<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ShiftLog — Al Safadi DIFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F4F7FB;
    --panel:#FFFFFF;
    --panel-hi:#EEF4FA;
    --line:#D8E2EC;
    --parchment:#111827;
    --parchment-dim:#64748B;
    --brass:#1769AA;
    --brass-hi:#2386D1;
    --spice:#D64545;
    --olive:#16805A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink); color:var(--parchment); font-family:'Work Sans',sans-serif;
    min-height:100vh; padding:18px 14px 50px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass-hi); font-weight:600; margin:0 0 4px; }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:28px; margin:0; }
  .clock{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--parchment-dim); text-align:right; }

  .stat-row{ display:flex; gap:8px; margin-bottom:16px; }
  .pill-stat{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; text-align:center;
  }
  .pill-stat .n{ font-family:'Fraunces',serif; font-size:22px; font-weight:700; }
  .pill-stat .l{ font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--parchment-dim); }
  .n.absent{ color:var(--spice); }
  .n.break{ color:var(--brass-hi); }
  .n.present{ color:var(--olive); }

  input[type=text]{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:11px 14px; color:var(--parchment); font-family:'Work Sans',sans-serif; font-size:14px;
  }
  input[type=text]:focus{ outline:2px solid var(--brass); outline-offset:1px; }
  #search{ margin-bottom:14px; }

  .staff-row{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .staff-row.absent{ border-color:#F0B8B8; background:#FFF7F7; }
  .staff-row.onbreak{ border-color:var(--brass); }

  .name-wrap{ flex:1; min-width:0; }
  .staff-name{
    font-weight:600; font-size:14.5px; background:none; border:none; color:var(--parchment);
    font-family:'Work Sans',sans-serif; width:100%; padding:2px 0;
  }
  .staff-name:focus{ outline:none; border-bottom:1px solid var(--brass); }
  .break-timer{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--brass-hi); margin-top:1px; }

  .btn{
    border:none; border-radius:9px; padding:9px 12px; font-size:12.5px; font-weight:600;
    cursor:pointer; white-space:nowrap; flex:none;
  }
  .btn-absent{ background:var(--panel-hi); border:1px solid var(--line); color:var(--parchment-dim); }
  .btn-absent.active{ background:var(--spice); color:#FFFFFF; border-color:var(--spice); }
  .btn-break{ background:var(--panel-hi); border:1px solid var(--line); color:var(--parchment-dim); }
  .btn-break.active{ background:var(--brass); color:#FFFFFF; border-color:var(--brass); }
  .btn-remove{ background:none; border:none; color:var(--spice); font-size:18px; cursor:pointer; padding:0 2px; line-height:1; }

  .section-label{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--parchment-dim);
    margin:22px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--line); }

  .add-row{ display:flex; gap:8px; }
  button.brass{
    background:var(--brass); color:#FFFFFF; border:none; border-radius:10px;
    padding:10px 16px; font-weight:600; font-size:14px; cursor:pointer; flex:none;
  }

  .empty-note{ color:var(--parchment-dim); font-size:13px; padding:10px 2px; }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#FFFFFF; border:1px solid var(--brass); color:var(--parchment);
    padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{ opacity:1; }

  .config-notice{
    background:var(--panel); border:1px dashed var(--spice); border-radius:var(--radius);
    padding:14px; font-size:13px; color:var(--parchment-dim); margin-bottom:16px; line-height:1.5;
  }
  .config-notice code{ color:var(--brass-hi); }

  .toolbar{display:flex;gap:8px;margin:0 0 12px}
  .filters{display:flex;gap:6px;flex:1;overflow-x:auto}
  .filter-btn{flex:1;min-width:72px;background:var(--panel);color:var(--parchment-dim);border:1px solid var(--line);border-radius:9px;padding:9px 8px;font:600 10px 'Work Sans',sans-serif;cursor:pointer;white-space:nowrap}
  .filter-btn.active{background:var(--brass);border-color:var(--brass);color:#FFFFFF}
  .refresh-btn{width:42px;flex:0 0 42px;background:var(--panel);color:var(--brass-hi);border:1px solid var(--line);border-radius:9px;font-size:18px;cursor:pointer}
  .refresh-btn.loading{opacity:.55;pointer-events:none}
  .btn:disabled,.btn-remove:disabled{opacity:.5;pointer-events:none}
  .last-refresh{font-size:10px;color:var(--parchment-dim);text-align:right;margin:-7px 2px 10px}
  .login-screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(17,24,39,.48)}
  .login-card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 18px 50px rgba(15,23,42,.25)}
  .login-card h2{font-family:'Fraunces',serif;font-size:24px;margin:0 0 6px}
  .login-card p{font-size:13px;color:var(--parchment-dim);margin:0 0 16px;line-height:1.45}
  .login-card input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--parchment);font:14px 'Work Sans',sans-serif;margin-bottom:10px}
  .login-card input:focus{outline:2px solid var(--brass);outline-offset:1px}
  .login-card button{width:100%}
  .login-error{min-height:18px;color:var(--spice);font-size:12px;margin:8px 0 0}

</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">Al Safadi — DIFC</p>
      <h1>ShiftLog</h1>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <div id="configNotice" class="config-notice" style="display:none">
    Set your Apps Script URL in <code>API_URL</code> near the top of the script before this works.
  </div>

  <div class="stat-row">
    <div class="pill-stat"><div class="n present" id="statOnDuty">–</div><div class="l">On Duty</div></div>
    <div class="pill-stat"><div class="n absent" id="statAway">–</div><div class="l">Away</div></div>
    <div class="pill-stat"><div class="n break" id="statBreak">–</div><div class="l">On break</div></div>
  </div>

  <input type="text" id="search" placeholder="Search staff…" oninput="renderStaff()">


  <div class="toolbar">
    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">ALL</button>
      <button class="filter-btn" data-filter="present" onclick="setFilter('present')">ON DUTY</button>
      <button class="filter-btn" data-filter="absent" onclick="setFilter('absent')">AWAY</button>
      <button class="filter-btn" data-filter="break" onclick="setFilter('break')">ON BREAK</button>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()" title="Refresh">↻</button>
  </div>
  <div class="last-refresh" id="lastRefresh"></div>

  <div id="staffList"></div>

  <div class="section-label">Add staff</div>
  <div class="add-row">
    <input type="text" id="newStaffName" placeholder="Staff name">
    <button class="brass" onclick="handleAddStaff()">Add</button>
  </div>

</div>

<div class="toast" id="toast"></div>
<div class="login-screen" id="loginScreen" aria-modal="true" role="dialog" aria-labelledby="loginTitle">
  <form class="login-card" id="loginForm">
    <h2 id="loginTitle">ShiftLog</h2>
    <p>Enter the team PIN to continue.</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN" required>
    <button class="brass" id="loginButton" type="submit">Continue</button>
    <div class="login-error" id="loginError" aria-live="polite"></div>
  </form>
</div>

<script>
// ==== CONFIG ====
const API_URL = "https://script.google.com/macros/s/AKfycbwFZPWAIo6H8mc6G_YUC0A2jb6kkIX-K0C7PYSfDXvk1Zeuf6BvNqGV7W1QrKw8t5sU-Q/exec";
// ================
const SESSION_TOKEN_KEY = 'shiftlog.sessionToken';

let staff = [];
let absentSet = new Set();
let openBreaks = {};
let currentFilter = 'all';
const busy = new Set();
let refreshPromise = null;
let sessionToken = sessionStorage.getItem(SESSION_TOKEN_KEY) || '';

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}
function updateClock(){
  document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{
    hour:'2-digit',minute:'2-digit',second:'2-digit'
  });
}
setInterval(updateClock,1000); updateClock();

async function api(action,params={}){
  const url=new URL(API_URL);
  url.searchParams.set('action',action);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  if(action!=='login' && sessionToken)url.searchParams.set('token',sessionToken);
  url.searchParams.set('_ts',Date.now());
  const res=await fetch(url.toString(),{cache:'no-store'});
  if(!res.ok) throw new Error('Network error: '+res.status);
  const data=await res.json();
  if(data&&data.authRequired){
    endSession(data.error||'Your session has expired. Please sign in again.');
    throw new Error(data.error||'Authentication required');
  }
  return data;
}
function showLogin(message=''){
  document.getElementById('loginError').textContent=message;
  document.getElementById('loginScreen').style.display='flex';
  setTimeout(()=>document.getElementById('pinInput').focus(),0);
}
function endSession(message=''){
  sessionToken='';
  sessionStorage.removeItem(SESSION_TOKEN_KEY);
  showLogin(message);
}
async function handleLogin(event){
  event.preventDefault();
  const input=document.getElementById('pinInput');
  const button=document.getElementById('loginButton');
  const error=document.getElementById('loginError');
  const pin=input.value;
  if(!pin)return;
  button.disabled=true; button.textContent='Checking…'; error.textContent='';
  try{
    const result=await api('login',{pin});
    if(!result||!result.token)throw new Error((result&&result.error)||'Unable to sign in');
    sessionToken=result.token;
    sessionStorage.setItem(SESSION_TOKEN_KEY,sessionToken);
    input.value='';
    document.getElementById('loginScreen').style.display='none';
    if(!await refreshAll(false))endSession('Unable to load ShiftLog. Please sign in again.');
  }catch(err){
    input.value='';
    error.textContent=err.message||'Unable to sign in';
    input.focus();
  }finally{button.disabled=false;button.textContent='Continue';}
}
function safeTimeParts(value){
  if(typeof value!=='string') return null;
  const m=value.trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if(!m) return null;
  const h=Number(m[1]),min=Number(m[2]),sec=Number(m[3]||0);
  if(h<0||h>23||min<0||min>59||sec<0||sec>59) return null;
  return [h,min,sec];
}
function secsSince(v){
  const p=safeTimeParts(v);
  if(!p)return 0;
  const d=new Date(); d.setHours(p[0],p[1],p[2],0);
  return Math.max(0,Math.floor((Date.now()-d.getTime())/1000));
}
function fmtDuration(sec){
  sec=Math.max(0,Number(sec)||0);
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}
function renderStats(){
  document.getElementById('statOnDuty').textContent=Math.max(0,staff.length-absentSet.size);
  document.getElementById('statAway').textContent=absentSet.size;
  document.getElementById('statBreak').textContent=Object.keys(openBreaks).length;
}
function setFilter(filter){
  currentFilter=filter;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
  renderStaff();
}
function renderStaff(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const holder=document.getElementById('staffList');
  let list=staff.filter(n=>String(n).toLowerCase().includes(q));
  list=list.filter(n=>{
    const a=absentSet.has(n), b=!!openBreaks[n];
    if(currentFilter==='present')return !a;
    if(currentFilter==='absent')return a;
    if(currentFilter==='break')return b;
    return true;
  });
  if(!list.length){
    holder.innerHTML='<div class="empty-note">No staff match — try a different search or filter.</div>';
    return;
  }
  holder.innerHTML=list.map(name=>{
    const a=absentSet.has(name), b=!!openBreaks[name], e=escapeAttr(name), arg=escapeHtml(JSON.stringify(name)), breakStart=escapeAttr(openBreaks[name]||'');
    const locked=busy.has('break:'+name)||busy.has('absent:'+name)||busy.has('remove:'+name)||busy.has('rename:'+name);
    const timer=b?`<div class="break-timer" data-break-start="${breakStart}">On break · ${fmtDuration(secsSince(openBreaks[name]))}</div>`:'';
    return `<div class="staff-row ${a?'absent':''} ${b?'onbreak':''}">
      <div class="name-wrap">
        <input class="staff-name" value="${e}" onchange="handleRename(${arg},this.value)">
        ${timer}
      </div>
      <button class="btn btn-absent ${a?'active':''}" ${locked?'disabled':''} onclick="handleToggleAway(${arg})">AWAY</button>
      <button class="btn btn-break ${b?'active':''}" ${locked?'disabled':''} onclick="handleToggleBreak(${arg})">${b?'End break':'Start break'}</button>
      <button class="btn-remove" ${locked?'disabled':''} onclick="handleRemoveStaff(${arg})" title="Remove">×</button>
    </div>`;
  }).join('');
}
async function refreshAll(showError=true){
  if(refreshPromise)return refreshPromise;
  refreshPromise=(async()=>{
    try{
      const [s,a,b]=await Promise.all([api('getStaff'),api('getAbsent'),api('getOpenBreaks')]);
      staff=Array.isArray(s)?s:[];
      absentSet=new Set(Array.isArray(a)?a:[]);
      openBreaks=(b&&!b.error)?b:{};
      renderStats(); renderStaff();
      document.getElementById('lastRefresh').textContent='Updated '+new Date().toLocaleTimeString([],{
        hour:'2-digit',minute:'2-digit',second:'2-digit'
      });
      return true;
    }catch(err){
      if(showError)toast(err.message||'Connection error');
      return false;
    }finally{refreshPromise=null;}
  })();
  return refreshPromise;
}
async function manualRefresh(){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('loading'); btn.textContent='…';
  try{if(await refreshAll(true))toast('Updated');}
  finally{btn.classList.remove('loading');btn.textContent='↻';}
}
async function handleToggleAway(name){
  const key='absent:'+name;if(busy.has(key))return;busy.add(key);
  try{
    const r=await api('toggleAbsent',{staff:name});
    if(r.error){toast(r.error);return;}
    r.absent?absentSet.add(name):absentSet.delete(name);
    renderStats();renderStaff();toast(name+(r.absent?' is AWAY':' is ON DUTY'));
  }catch(e){toast(e.message||'Connection error')}
  finally{busy.delete(key);renderStaff();}
}
async function handleToggleBreak(name){
  const key='break:'+name;if(busy.has(key))return;busy.add(key);renderStaff();
  try{
    if(openBreaks[name]){
      const r=await api('endBreak',{staff:name});
      if(r.error){toast(r.error);return;}
      delete openBreaks[name];renderStats();renderStaff();
      toast(name+' back ('+(Number(r.durationMinutes)||0)+' min)');
    }else{
      const r=await api('startBreak',{staff:name});
      if(r.error){toast(r.error);return;}
      openBreaks[name]=r.startTime||new Date().toTimeString().slice(0,8);
      renderStats();renderStaff();toast(name+' started break');
    }
  }catch(e){toast(e.message||'Connection error')}
  finally{busy.delete(key);renderStaff();}
}
async function handleAddStaff(){
  const input=document.getElementById('newStaffName'),name=input.value.trim();
  if(!name||busy.has('addStaff'))return;busy.add('addStaff');
  try{
    if(staff.some(n=>String(n).toLowerCase()===name.toLowerCase())){toast('Staff already exists');return;}
    const r=await api('addStaff',{name});if(r.error){toast(r.error);return;}
    staff.push(name);staff.sort((a,b)=>String(a).localeCompare(String(b)));input.value='';
    renderStats();renderStaff();toast('Added '+name);
  }catch(e){toast(e.message||'Connection error')}finally{busy.delete('addStaff');}
}
async function handleRemoveStaff(name){
  if(!confirm('Remove '+name+' from the staff list?'))return;
  const key='remove:'+name;if(busy.has(key))return;busy.add(key);
  try{
    const r=await api('removeStaff',{name});if(r.error){toast(r.error);return;}
    staff=staff.filter(n=>n!==name);absentSet.delete(name);delete openBreaks[name];
    renderStats();renderStaff();toast('Removed '+name);
  }catch(e){toast(e.message||'Connection error')}finally{busy.delete(key);}
}
async function handleRename(oldName,newName){
  newName=newName.trim();if(!newName||newName===oldName){renderStaff();return;}
  const key='rename:'+oldName;if(busy.has(key))return;busy.add(key);
  try{
    const r=await api('renameStaff',{oldName,newName});if(r.error){toast(r.error);return;}
    staff=staff.map(n=>n===oldName?newName:n);
    if(absentSet.has(oldName)){absentSet.delete(oldName);absentSet.add(newName);}
    if(openBreaks[oldName]){openBreaks[newName]=openBreaks[oldName];delete openBreaks[oldName];}
    renderStats();renderStaff();toast('Renamed to '+newName);
  }catch(e){toast(e.message||'Connection error')}finally{busy.delete(key);}
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escapeAttr(s){return escapeHtml(s).replace(/'/g,'&#39;');}
function updateBreakTimers(){
  document.querySelectorAll('[data-break-start]').forEach(el=>{
    el.textContent='On break · '+fmtDuration(secsSince(el.dataset.breakStart));
  });
}

setInterval(updateBreakTimers,1000);
setInterval(()=>{if(sessionToken)refreshAll(false);},60000);
document.getElementById('loginForm').addEventListener('submit',handleLogin);

if(API_URL.indexOf('PASTE_YOUR')!==-1){
  document.getElementById('configNotice').style.display='block';
}else{
  if(sessionToken){
    document.getElementById('loginScreen').style.display='none';
    refreshAll(false);
  }else{
    showLogin();
  }
}
</script>
</body>
</html>
