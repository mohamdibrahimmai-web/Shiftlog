<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ShiftLog — Al Safadi DIFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#F4F7FB;--panel:#FFFFFF;--panel-hi:#EEF4FA;--line:#D8E2EC;--parchment:#111827;--parchment-dim:#64748B;--brass:#1769AA;--brass-hi:#2386D1;--spice:#D64545;--olive:#16805A;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--ink);color:var(--parchment);font-family:'Work Sans',sans-serif;min-height:100vh;padding:18px 14px 50px}.wrap{max-width:640px;margin:0 auto}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-hi);font-weight:600;margin:0 0 4px}h1{font-family:'Fraunces',serif;font-weight:700;font-size:28px;margin:0}.clock{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--parchment-dim);text-align:right}.stat-row{display:flex;gap:8px;margin-bottom:16px}.pill-stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}.pill-stat .n{font-family:'Fraunces',serif;font-size:22px;font-weight:700}.pill-stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--parchment-dim)}.n.absent{color:var(--spice)}.n.break{color:var(--brass-hi)}.n.present{color:var(--olive)}input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--parchment);font-family:'Work Sans',sans-serif;font-size:14px}input[type=text]:focus{outline:2px solid var(--brass);outline-offset:1px}#search{margin-bottom:14px}.staff-row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:8px}.staff-row.absent{border-color:#F0B8B8;background:#FFF7F7}.staff-row.onbreak{border-color:var(--brass)}.name-wrap{flex:1;min-width:0}.staff-name{font-weight:600;font-size:14.5px;background:none;border:none;color:var(--parchment);font-family:'Work Sans',sans-serif;width:100%;padding:2px 0}.staff-name:focus{outline:none;border-bottom:1px solid var(--brass)}.break-timer{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--brass-hi);margin-top:1px}.break-history{font-size:10.5px;color:var(--parchment-dim);margin-top:4px;line-height:1.45}.break-history strong{color:var(--parchment);font-weight:600}.btn-break.used{background:#F3F4F6;color:#9CA3AF;border-color:#E5E7EB}.btn{border:none;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}.btn-absent{background:var(--panel-hi);border:1px solid var(--line);color:var(--parchment-dim)}.btn-absent.active{background:var(--spice);color:#fff;border-color:var(--spice)}.btn-break{background:var(--panel-hi);border:1px solid var(--line);color:var(--parchment-dim)}.btn-break.active{background:var(--brass);color:#fff;border-color:var(--brass)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-remove{background:none;border:none;color:var(--spice);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}.section-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--parchment-dim);margin:22px 0 10px;display:flex;align-items:center;gap:8px}.section-label::after{content:'';flex:1;height:1px;background:var(--line)}.add-row{display:flex;gap:8px}.action-row{display:flex;gap:8px;flex-wrap:wrap}.action-row button{flex:1;min-width:120px}button.brass{background:var(--brass);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;flex:none}.secondary{background:var(--panel);color:var(--parchment-dim);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer}.empty-note{color:var(--parchment-dim);font-size:13px;padding:10px 2px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--brass);color:var(--parchment);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}.toast.show{opacity:1}.toolbar{display:flex;gap:8px;margin:0 0 12px}.filters{display:flex;gap:6px;flex:1;overflow-x:auto}.filter-btn{flex:1;min-width:72px;background:var(--panel);color:var(--parchment-dim);border:1px solid var(--line);border-radius:9px;padding:9px 8px;font:600 10px 'Work Sans',sans-serif;cursor:pointer;white-space:nowrap}.filter-btn.active{background:var(--brass);border-color:var(--brass);color:#fff}.refresh-btn{width:42px;flex:0 0 42px;background:var(--panel);color:var(--brass-hi);border:1px solid var(--line);border-radius:9px;font-size:18px;cursor:pointer}.last-refresh{font-size:10px;color:var(--parchment-dim);text-align:right;margin:-7px 2px 10px}.storage-note{font-size:11px;color:var(--parchment-dim);line-height:1.45;margin-top:9px}#restoreInput{display:none}@media(max-width:520px){.staff-row{gap:6px;padding:9px}.btn{padding:9px 9px;font-size:11.5px}.staff-name{font-size:13.5px}}

.history-btn{background:var(--panel);color:var(--brass);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer;margin:0 0 14px;width:100%}.history-panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.history-panel.show{display:block}.history-head{display:flex;gap:8px;align-items:center;margin-bottom:12px}.history-head select{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;font:600 13px 'Work Sans',sans-serif;color:var(--parchment)}.history-close{background:none;border:none;font-size:22px;line-height:1;color:var(--parchment-dim);cursor:pointer}.history-day-title{font-weight:700;margin-bottom:10px}.history-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.history-name{font-weight:700;font-size:13px;margin-bottom:5px}.history-line{font-size:12px;color:var(--parchment-dim);line-height:1.55}.history-total{font-size:12px;font-weight:700;margin-top:5px;color:var(--parchment)}.history-empty{font-size:12px;color:var(--parchment-dim);padding:4px 0}
</style>
</head>
<body>
<div class="wrap">
<header><div><p class="eyebrow">Al Safadi — DIFC</p><h1>ShiftLog</h1></div><div class="clock" id="clock"></div></header>
<div class="stat-row"><div class="pill-stat"><div class="n present" id="statOnDuty">0</div><div class="l">On Duty</div></div><div class="pill-stat"><div class="n absent" id="statAway">0</div><div class="l">Away</div></div><div class="pill-stat"><div class="n break" id="statBreak">0</div><div class="l">On break</div></div></div>
<input type="text" id="search" placeholder="Search staff…" oninput="renderStaff()">
<div class="toolbar"><div class="filters"><button class="filter-btn active" data-filter="all" onclick="setFilter('all')">ALL</button><button class="filter-btn" data-filter="present" onclick="setFilter('present')">ON DUTY</button><button class="filter-btn" data-filter="absent" onclick="setFilter('absent')">AWAY</button><button class="filter-btn" data-filter="break" onclick="setFilter('break')">ON BREAK</button></div><button class="refresh-btn" onclick="refreshLocal()" title="Refresh">↻</button></div>
<div class="last-refresh" id="lastRefresh"></div>
<button class="history-btn" onclick="toggleHistory()">HISTORY</button>
<div class="history-panel" id="historyPanel">
  <div class="history-head"><select id="historyDate" onchange="renderHistory()"></select><button class="history-close" onclick="toggleHistory(false)" title="Close">×</button></div>
  <div id="historyContent"></div>
</div>
<div id="staffList"></div>
<div class="section-label">Add staff</div><div class="add-row"><input type="text" id="newStaffName" placeholder="Staff name"><button class="brass" onclick="handleAddStaff()">Add</button></div>
<div class="section-label">Local data</div><div class="action-row"><button class="secondary" onclick="backupData()">Backup</button><button class="secondary" onclick="document.getElementById('restoreInput').click()">Restore</button></div><input id="restoreInput" type="file" accept="application/json,.json" onchange="restoreData(event)"><div class="storage-note">Data is stored only on this device and browser. Use Backup before clearing browser data or moving to another device.</div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='shiftlog.local.v1';
const INITIAL_STAFF=['Bashar 2428','Naseer 1049','Rami 3234','Solami 1997','Ella 2315','Nour 1888','Lourenz 2875','Sanju 2261','Najiba 3219','Herelyn 3002','Angelina 2528','Shyam 3181','Ibrahim 2355','Ahmad.R 2075','Jobert 2299','Noivi 2847','Sagar 3299','Hasan 2346','Arzhen 3298','Janeca 2380','Zakaria 1916','Ali Rilwan 2647','Al Halabi 2877','Hasim 2483','Numan 2021','Farhan 2710','Usama 1873','Jamaica.Y 2872','Maya 2415','Sadaqat 2162','Rawand 2724','Hamza 2141','Uddhav 906','Jaffar 2709','Mafaz 1763','Dilip 1094','Marilyn 1414','Abed 2222','Rajandra 1358','Antoinet 1009','Rahim 2708','Hassan 1785','Hesham 2142'];
let state=loadState();let currentFilter='all';
function defaultState(){return{version:1,staff:[...INITIAL_STAFF].sort((a,b)=>a.localeCompare(b)),away:[],openBreaks:{},breakLog:[],updatedAt:new Date().toISOString()}}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultState();const x=JSON.parse(raw);return normalizeState(x)}catch(e){console.error(e);return defaultState()}}
function normalizeState(x){const staff=Array.isArray(x.staff)?x.staff.map(String):[];const unique=[...new Set(staff)];const away=Array.isArray(x.away)?[...new Set(x.away.filter(n=>unique.includes(n)))]:[];const awaySet=new Set(away);const openBreaks=x.openBreaks&&typeof x.openBreaks==='object'?Object.fromEntries(Object.entries(x.openBreaks).filter(([n,start])=>unique.includes(n)&&!awaySet.has(n)&&Number.isFinite(Date.parse(start)))):{};return{version:1,staff:unique,away,openBreaks,breakLog:Array.isArray(x.breakLog)?x.breakLog:[],updatedAt:x.updatedAt||new Date().toISOString()}}
function saveState(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.error(e);toast('Could not save data')}renderStats();renderStaff();updateLastRefresh();const hp=document.getElementById('historyPanel');if(hp&&hp.classList.contains('show')){populateHistoryDates();renderHistory()}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2000)}
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}setInterval(updateClock,1000);updateClock();
function updateLastRefresh(){document.getElementById('lastRefresh').textContent='Saved '+new Date(state.updatedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function renderStats(){const away=new Set(state.away),onBreak=new Set(Object.keys(state.openBreaks));let onDuty=0;state.staff.forEach(n=>{if(!away.has(n)&&!onBreak.has(n))onDuty++});document.getElementById('statOnDuty').textContent=onDuty;document.getElementById('statAway').textContent=away.size;document.getElementById('statBreak').textContent=onBreak.size}
function setFilter(filter){currentFilter=filter;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));renderStaff()}
function renderStaff(){const q=document.getElementById('search').value.trim().toLowerCase();const away=new Set(state.away);let list=state.staff.filter(n=>n.toLowerCase().includes(q));list=list.filter(n=>{const a=away.has(n),b=!!state.openBreaks[n];if(currentFilter==='present')return !a&&!b;if(currentFilter==='absent')return a;if(currentFilter==='break')return b;return true});const holder=document.getElementById('staffList');if(!list.length){holder.innerHTML='<div class="empty-note">No staff match — try a different search or filter.</div>';return}holder.innerHTML=list.map(name=>{const a=away.has(name),b=!!state.openBreaks[name],arg=escapeHtml(JSON.stringify(name)),e=escapeAttr(name);const done=getTodayBreaks(name),used=done.length+(b?1:0),currentNo=Math.min(4,done.length+1);const timer=b?`<div class="break-timer" data-break-start="${escapeAttr(state.openBreaks[name])}" data-break-number="${currentNo}">Break ${currentNo} · ${fmtDuration(secsSince(state.openBreaks[name]))}</div>`:'';const history=done.length?`<div class="break-history">${done.map((x,i)=>`<strong>Break ${x.breakNumber||i+1}</strong>: ${formatMinutes(x.durationSeconds)}`).join(' &nbsp;•&nbsp; ')}</div>`:'';const allUsed=!b&&done.length>=4;const breakLabel=b?'End break':(allUsed?'Used 4/4':'Start break');return `<div class="staff-row ${a?'absent':''} ${b?'onbreak':''}"><div class="name-wrap"><input class="staff-name" value="${e}" onchange="handleRename(${arg},this.value)">${timer}${history}</div><button class="btn btn-absent ${a?'active':''}" onclick="handleToggleAway(${arg})">AWAY</button><button class="btn btn-break ${b?'active':''} ${allUsed?'used':''}" onclick="handleToggleBreak(${arg})" ${a&&!b?'disabled title=\"Set On Duty before starting a break\"':''}>${breakLabel}</button><button class="btn-remove" onclick="handleRemoveStaff(${arg})" title="Remove">×</button></div>`}).join('')}
function handleToggleAway(name){const set=new Set(state.away);if(set.has(name)){set.delete(name);state.away=[...set];saveState();toast(name+' is ON DUTY');return}if(state.openBreaks[name]){closeBreak(name,false)}set.add(name);state.away=[...set];saveState();toast(name+' is AWAY')}
function localDateKey(value=new Date()){const d=value instanceof Date?value:new Date(value);if(Number.isNaN(d.getTime()))return '';const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function getTodayBreaks(name){const today=localDateKey();return state.breakLog.filter(x=>x&&x.staff===name&&localDateKey(x.start)===today).sort((a,b)=>Date.parse(a.start)-Date.parse(b.start))}
function getHistoryDates(){return [...new Set(state.breakLog.filter(x=>x&&x.start).map(x=>localDateKey(x.start)).filter(Boolean))].sort().reverse()}
function prettyDate(key){const d=new Date(key+'T12:00:00');return d.toLocaleDateString([],{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
function toggleHistory(force){const panel=document.getElementById('historyPanel');const show=typeof force==='boolean'?force:!panel.classList.contains('show');panel.classList.toggle('show',show);if(show){populateHistoryDates();renderHistory()}}
function populateHistoryDates(){const sel=document.getElementById('historyDate');const dates=getHistoryDates();const current=sel.value;sel.innerHTML=dates.length?dates.map(d=>`<option value="${escapeAttr(d)}">${escapeHtml(prettyDate(d))}</option>`).join(''):'<option value="">No history yet</option>';if(current&&dates.includes(current))sel.value=current}
function renderHistory(){const box=document.getElementById('historyContent');const key=document.getElementById('historyDate').value;if(!key){box.innerHTML='<div class="history-empty">No saved break history yet.</div>';return}const rows=state.breakLog.filter(x=>x&&localDateKey(x.start)===key).sort((a,b)=>String(a.staff).localeCompare(String(b.staff))||Date.parse(a.start)-Date.parse(b.start));if(!rows.length){box.innerHTML='<div class="history-empty">No breaks saved for this day.</div>';return}const grouped={};rows.forEach(x=>(grouped[x.staff]||(grouped[x.staff]=[])).push(x));box.innerHTML=`<div class="history-day-title">${escapeHtml(prettyDate(key))}</div>`+Object.entries(grouped).map(([name,list])=>{list.sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));const total=list.reduce((sum,x)=>sum+(Number(x.durationSeconds)||0),0);const lines=list.map((x,i)=>`<div class="history-line">Break ${x.breakNumber||i+1} — ${formatMinutes(x.durationSeconds)}</div>`).join('');return `<div class="history-card"><div class="history-name">${escapeHtml(name)}</div>${lines}<div class="history-total">Total: ${formatMinutes(total)}</div></div>`}).join('')}

function formatMinutes(seconds){const sec=Math.max(0,Number(seconds)||0),mins=Math.floor(sec/60),rem=sec%60;return rem?`${mins}m ${rem}s`:`${mins} min`}
function closeBreak(name,notify=true){const start=state.openBreaks[name];if(!start)return 0;const end=new Date().toISOString();const durationSeconds=Math.max(0,Math.floor((Date.parse(end)-Date.parse(start))/1000));const breakNumber=Math.min(4,getTodayBreaks(name).length+1);state.breakLog.push({staff:name,start,end,durationSeconds,breakNumber});delete state.openBreaks[name];if(notify){if(breakNumber>=4)toast(name+' — Full break allowance used for today');else toast(name+' back · Break '+breakNumber+' ('+formatMinutes(durationSeconds)+')')}return durationSeconds}
function handleToggleBreak(name){if(state.openBreaks[name]){closeBreak(name);saveState();return}if(state.away.includes(name)){toast('Set '+name+' ON DUTY first');return}const completed=getTodayBreaks(name).length;if(completed>=4){toast('Full break allowance used for today');return}const breakNumber=completed+1;state.openBreaks[name]=new Date().toISOString();saveState();updateBreakTimers();toast(name+' started Break '+breakNumber+' of 4')}
function handleAddStaff(){const input=document.getElementById('newStaffName'),name=input.value.trim();if(!name)return;if(state.staff.some(n=>n.toLowerCase()===name.toLowerCase())){toast('Staff already exists');return}state.staff.push(name);state.staff.sort((a,b)=>a.localeCompare(b));input.value='';saveState();toast('Added '+name)}
function handleRemoveStaff(name){if(!confirm('Remove '+name+' and all saved data for this staff member?'))return;state.staff=state.staff.filter(n=>n!==name);state.away=state.away.filter(n=>n!==name);delete state.openBreaks[name];state.breakLog=state.breakLog.filter(x=>x.staff!==name);saveState();toast('Removed '+name)}
function handleRename(oldName,newName){newName=newName.trim();if(!newName||newName===oldName){renderStaff();return}if(state.staff.some(n=>n!==oldName&&n.toLowerCase()===newName.toLowerCase())){toast('Staff already exists');renderStaff();return}state.staff=state.staff.map(n=>n===oldName?newName:n);state.away=state.away.map(n=>n===oldName?newName:n);if(state.openBreaks[oldName]){state.openBreaks[newName]=state.openBreaks[oldName];delete state.openBreaks[oldName]}state.breakLog=state.breakLog.map(x=>x.staff===oldName?{...x,staff:newName}:x);state.staff.sort((a,b)=>a.localeCompare(b));saveState();toast('Renamed to '+newName)}
function refreshLocal(){state=loadState();state=normalizeState(state);renderStats();renderStaff();updateLastRefresh();toast('Updated')}
function backupData(){const payload={app:'ShiftLog',exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='shiftlog-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup created')}
function restoreData(event){const file=event.target.files&&event.target.files[0];event.target.value='';if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const incoming=parsed&&parsed.data?parsed.data:parsed;if(!incoming||!Array.isArray(incoming.staff))throw new Error('Invalid backup');if(!confirm('Replace current ShiftLog data with this backup?'))return;state=normalizeState(incoming);saveState();toast('Backup restored')}catch(e){toast('Invalid backup file')}};reader.readAsText(file)}
function secsSince(iso){const ms=Date.now()-Date.parse(iso);return Number.isFinite(ms)?Math.max(0,Math.floor(ms/1000)):0}function fmtDuration(sec){sec=Math.max(0,Number(sec)||0);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}function updateBreakTimers(){document.querySelectorAll('[data-break-start]').forEach(el=>{const n=el.dataset.breakNumber||'';el.textContent=(n?'Break '+n+' · ':'On break · ')+fmtDuration(secsSince(el.dataset.breakStart))})}setInterval(updateBreakTimers,1000);
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function escapeAttr(s){return escapeHtml(s).replace(/'/g,'&#39;')}
state=normalizeState(state);renderStats();renderStaff();updateLastRefresh();
</script>
</body>
</html>
