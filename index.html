<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ShiftLog — Al Safadi DIFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#F4F7FB;--panel:#FFFFFF;--panel-hi:#EEF4FA;--line:#D8E2EC;--parchment:#111827;--parchment-dim:#64748B;--brass:#1769AA;--brass-hi:#2386D1;--spice:#D64545;--olive:#16805A;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--ink);color:var(--parchment);font-family:'Work Sans',sans-serif;min-height:100vh;padding:18px 14px 50px}.wrap{max-width:640px;margin:0 auto}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-hi);font-weight:600;margin:0 0 4px}h1{font-family:'Fraunces',serif;font-weight:700;font-size:28px;margin:0}.clock{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--parchment-dim);text-align:right}.stat-row{display:flex;gap:8px;margin-bottom:16px}.pill-stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}.pill-stat .n{font-family:'Fraunces',serif;font-size:22px;font-weight:700}.pill-stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--parchment-dim)}.n.absent{color:var(--spice)}.n.break{color:var(--brass-hi)}.n.present{color:var(--olive)}input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--parchment);font-family:'Work Sans',sans-serif;font-size:14px}input[type=text]:focus{outline:2px solid var(--brass);outline-offset:1px}#search{margin-bottom:14px}.staff-row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:8px}.staff-row.absent{border-color:#F0B8B8;background:#FFF7F7}.staff-row.onbreak{border-color:var(--brass)}.name-wrap{flex:1;min-width:0}.staff-name{font-weight:600;font-size:14.5px;background:none;border:none;color:var(--parchment);font-family:'Work Sans',sans-serif;width:100%;padding:2px 0}.staff-name:focus{outline:none;border-bottom:1px solid var(--brass)}.break-timer{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--brass-hi);margin-top:1px}.btn{border:none;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}.btn-absent{background:var(--panel-hi);border:1px solid var(--line);color:var(--parchment-dim)}.btn-absent.active{background:var(--spice);color:#fff;border-color:var(--spice)}.btn-break{background:var(--panel-hi);border:1px solid var(--line);color:var(--parchment-dim)}.btn-break.active{background:var(--brass);color:#fff;border-color:var(--brass)}.btn-remove{background:none;border:none;color:var(--spice);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}.section-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--parchment-dim);margin:22px 0 10px;display:flex;align-items:center;gap:8px}.section-label::after{content:'';flex:1;height:1px;background:var(--line)}.add-row{display:flex;gap:8px}.action-row{display:flex;gap:8px;flex-wrap:wrap}.action-row button{flex:1;min-width:120px}button.brass{background:var(--brass);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;flex:none}.secondary{background:var(--panel);color:var(--parchment-dim);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer}.empty-note{color:var(--parchment-dim);font-size:13px;padding:10px 2px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--brass);color:var(--parchment);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}.toast.show{opacity:1}.toolbar{display:flex;gap:8px;margin:0 0 12px}.filters{display:flex;gap:6px;flex:1;overflow-x:auto}.filter-btn{flex:1;min-width:72px;background:var(--panel);color:var(--parchment-dim);border:1px solid var(--line);border-radius:9px;padding:9px 8px;font:600 10px 'Work Sans',sans-serif;cursor:pointer;white-space:nowrap}.filter-btn.active{background:var(--brass);border-color:var(--brass);color:#fff}.refresh-btn{width:42px;flex:0 0 42px;background:var(--panel);color:var(--brass-hi);border:1px solid var(--line);border-radius:9px;font-size:18px;cursor:pointer}.last-refresh{font-size:10px;color:var(--parchment-dim);text-align:right;margin:-7px 2px 10px}.storage-note{font-size:11px;color:var(--parchment-dim);line-height:1.45;margin-top:9px}#restoreInput{display:none}@media(max-width:520px){.staff-row{gap:6px;padding:9px}.btn{padding:9px 9px;font-size:11.5px}.staff-name{font-size:13.5px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><p class="eyebrow">Al Safadi — DIFC</p><h1>ShiftLog</h1></div><div class="clock" id="clock"></div></header>
<div class="stat-row"><div class="pill-stat"><div class="n present" id="statOnDuty">0</div><div class="l">On Duty</div></div><div class="pill-stat"><div class="n absent" id="statAway">0</div><div class="l">Away</div></div><div class="pill-stat"><div class="n break" id="statBreak">0</div><div class="l">On break</div></div></div>
<input type="text" id="search" placeholder="Search staff…" oninput="renderStaff()">
<div class="toolbar"><div class="filters"><button class="filter-btn active" data-filter="all" onclick="setFilter('all')">ALL</button><button class="filter-btn" data-filter="present" onclick="setFilter('present')">ON DUTY</button><button class="filter-btn" data-filter="absent" onclick="setFilter('absent')">AWAY</button><button class="filter-btn" data-filter="break" onclick="setFilter('break')">ON BREAK</button></div><button class="refresh-btn" onclick="refreshLocal()" title="Refresh">↻</button></div>
<div class="last-refresh" id="lastRefresh"></div>
<div id="staffList"></div>
<div class="section-label">Add staff</div><div class="add-row"><input type="text" id="newStaffName" placeholder="Staff name"><button class="brass" onclick="handleAddStaff()">Add</button></div>
<div class="section-label">Local data</div><div class="action-row"><button class="secondary" onclick="backupData()">Backup</button><button class="secondary" onclick="document.getElementById('restoreInput').click()">Restore</button></div><input id="restoreInput" type="file" accept="application/json,.json" onchange="restoreData(event)"><div class="storage-note">Data is stored only on this device and browser. Use Backup before clearing browser data or moving to another device.</div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='shiftlog.local.v1';
const INITIAL_STAFF=['Bashar 2428','Naseer 1049','Rami 3234','Solami 1997','Ella 2315','Nour 1888','Lourenz 2875','Sanju 2261','Najiba 3219','Herelyn 3002','Angelina 2528','Shyam 3181','Ibrahim 2355','Ahmad.R 2075','Jobert 2299','Noivi 2847','Sagar 3299','Hasan 2346','Arzhen 3298','Janeca 2380','Zakaria 1916','Ali Rilwan 2647','Al Halabi 2877','Hasim 2483','Numan 2021','Farhan 2710','Usama 1873','Jamaica.Y 2872','Maya 2415','Sadaqat 2162','Rawand 2724','Hamza 2141','Uddhav 906','Jaffar 2709','Mafaz 1763','Dilip 1094','Marilyn 1414','Abed 2222','Rajandra 1358','Antoinet 1009','Rahim 2708','Hassan 1785','Hesham 2142'];
let state=loadState();let currentFilter='all';
function defaultState(){return{version:1,staff:[...INITIAL_STAFF].sort((a,b)=>a.localeCompare(b)),away:[],openBreaks:{},breakLog:[],updatedAt:new Date().toISOString()}}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultState();const x=JSON.parse(raw);return normalizeState(x)}catch(e){console.error(e);return defaultState()}}
function normalizeState(x){const staff=Array.isArray(x.staff)?x.staff.map(String):[];return{version:1,staff:[...new Set(staff)],away:Array.isArray(x.away)?x.away.filter(n=>staff.includes(n)):[],openBreaks:x.openBreaks&&typeof x.openBreaks==='object'?Object.fromEntries(Object.entries(x.openBreaks).filter(([n])=>staff.includes(n))):{},breakLog:Array.isArray(x.breakLog)?x.breakLog:[],updatedAt:x.updatedAt||new Date().toISOString()}}
function saveState(){state.updatedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));renderStats();renderStaff();updateLastRefresh()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2000)}
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}setInterval(updateClock,1000);updateClock();
function updateLastRefresh(){document.getElementById('lastRefresh').textContent='Saved '+new Date(state.updatedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function renderStats(){const away=new Set(state.away);document.getElementById('statOnDuty').textContent=Math.max(0,state.staff.length-away.size);document.getElementById('statAway').textContent=away.size;document.getElementById('statBreak').textContent=Object.keys(state.openBreaks).length}
function setFilter(filter){currentFilter=filter;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));renderStaff()}
function renderStaff(){const q=document.getElementById('search').value.trim().toLowerCase();const away=new Set(state.away);let list=state.staff.filter(n=>n.toLowerCase().includes(q));list=list.filter(n=>{const a=away.has(n),b=!!state.openBreaks[n];if(currentFilter==='present')return !a;if(currentFilter==='absent')return a;if(currentFilter==='break')return b;return true});const holder=document.getElementById('staffList');if(!list.length){holder.innerHTML='<div class="empty-note">No staff match — try a different search or filter.</div>';return}holder.innerHTML=list.map(name=>{const a=away.has(name),b=!!state.openBreaks[name],arg=escapeHtml(JSON.stringify(name)),e=escapeAttr(name);const timer=b?`<div class="break-timer" data-break-start="${escapeAttr(state.openBreaks[name])}">On break · ${fmtDuration(secsSince(state.openBreaks[name]))}</div>`:'';return `<div class="staff-row ${a?'absent':''} ${b?'onbreak':''}"><div class="name-wrap"><input class="staff-name" value="${e}" onchange="handleRename(${arg},this.value)">${timer}</div><button class="btn btn-absent ${a?'active':''}" onclick="handleToggleAway(${arg})">AWAY</button><button class="btn btn-break ${b?'active':''}" onclick="handleToggleBreak(${arg})">${b?'End break':'Start break'}</button><button class="btn-remove" onclick="handleRemoveStaff(${arg})" title="Remove">×</button></div>`}).join('')}
function handleToggleAway(name){const set=new Set(state.away);if(set.has(name)){set.delete(name);toast(name+' is ON DUTY')}else{set.add(name);toast(name+' is AWAY')}state.away=[...set];saveState()}
function handleToggleBreak(name){if(state.openBreaks[name]){const start=state.openBreaks[name];const end=new Date().toISOString();const durationSeconds=Math.max(0,Math.floor((Date.parse(end)-Date.parse(start))/1000));state.breakLog.push({staff:name,start,end,durationSeconds});delete state.openBreaks[name];saveState();toast(name+' back ('+Math.round(durationSeconds/60)+' min)')}else{state.openBreaks[name]=new Date().toISOString();saveState();toast(name+' started break')}}
function handleAddStaff(){const input=document.getElementById('newStaffName'),name=input.value.trim();if(!name)return;if(state.staff.some(n=>n.toLowerCase()===name.toLowerCase())){toast('Staff already exists');return}state.staff.push(name);state.staff.sort((a,b)=>a.localeCompare(b));input.value='';saveState();toast('Added '+name)}
function handleRemoveStaff(name){if(!confirm('Remove '+name+' and all saved data for this staff member?'))return;state.staff=state.staff.filter(n=>n!==name);state.away=state.away.filter(n=>n!==name);delete state.openBreaks[name];state.breakLog=state.breakLog.filter(x=>x.staff!==name);saveState();toast('Removed '+name)}
function handleRename(oldName,newName){newName=newName.trim();if(!newName||newName===oldName){renderStaff();return}if(state.staff.some(n=>n!==oldName&&n.toLowerCase()===newName.toLowerCase())){toast('Staff already exists');renderStaff();return}state.staff=state.staff.map(n=>n===oldName?newName:n);state.away=state.away.map(n=>n===oldName?newName:n);if(state.openBreaks[oldName]){state.openBreaks[newName]=state.openBreaks[oldName];delete state.openBreaks[oldName]}state.breakLog=state.breakLog.map(x=>x.staff===oldName?{...x,staff:newName}:x);state.staff.sort((a,b)=>a.localeCompare(b));saveState();toast('Renamed to '+newName)}
function refreshLocal(){state=loadState();renderStats();renderStaff();updateLastRefresh();toast('Updated')}
function backupData(){const payload={app:'ShiftLog',exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='shiftlog-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup created')}
function restoreData(event){const file=event.target.files&&event.target.files[0];event.target.value='';if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const incoming=parsed&&parsed.data?parsed.data:parsed;if(!incoming||!Array.isArray(incoming.staff))throw new Error('Invalid backup');if(!confirm('Replace current ShiftLog data with this backup?'))return;state=normalizeState(incoming);saveState();toast('Backup restored')}catch(e){toast('Invalid backup file')}};reader.readAsText(file)}
function secsSince(iso){const ms=Date.now()-Date.parse(iso);return Number.isFinite(ms)?Math.max(0,Math.floor(ms/1000)):0}function fmtDuration(sec){sec=Math.max(0,Number(sec)||0);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}function updateBreakTimers(){document.querySelectorAll('[data-break-start]').forEach(el=>{el.textContent='On break · '+fmtDuration(secsSince(el.dataset.breakStart))})}setInterval(updateBreakTimers,1000);
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function escapeAttr(s){return escapeHtml(s).replace(/'/g,'&#39;')}
renderStats();renderStaff();updateLastRefresh();
</script>
</body>
</html>
